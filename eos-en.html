<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');
  var moon=document.getElementById('iconMoon'), sun=document.getElementById('iconSun');
  function apply(t){
    if(t==='dark'){root.setAttribute('data-theme','dark');moon.style.display='none';sun.style.display='block';}
    else{root.removeAttribute('data-theme');moon.style.display='block';sun.style.display='none';}
  }
  var saved=null;
  try{saved=localStorage.getItem('hs-theme');}catch(e){}
  if(!saved){saved=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  apply(saved);
  btn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    apply(next);
    try{localStorage.setItem('hs-theme',next);}catch(e){}
  });
})();

(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');
  var moon=document.getElementById('iconMoon'), sun=document.getElementById('iconSun');
  function apply(t){
    if(t==='dark'){root.setAttribute('data-theme','dark');moon.style.display='none';sun.style.display='block';}
    else{root.removeAttribute('data-theme');moon.style.display='block';sun.style.display='none';}
  }
  var saved=null;
  try{saved=localStorage.getItem('hs-theme');}catch(e){}
  if(!saved){saved=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  apply(saved);
  btn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    apply(next);
    try{localStorage.setItem('hs-theme',next);}catch(e){}
  });
})();

document.getElementById('year').textContent=new Date().getFullYear();

function formatNumber(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function formatInt(n){return n.toLocaleString('en-US')}

function updateAll(){
  var s=parseFloat(document.getElementById('eosSalary').value)||0,
      sd=document.getElementById('eosStartDate').value,
      ed=document.getElementById('eosEndDate').value,
      ct=document.getElementById('eosContractType').value,
      r=document.getElementById('eosReason').value,
      ctt=document.getElementById('eosContractType').selectedOptions[0]?.text||'—',
      rt=document.getElementById('eosReason').selectedOptions[0]?.text||'—';

  document.getElementById('eosSalaryDisplay').textContent=s>0?formatInt(s)+' ريال':'—';
  document.getElementById('eosContractDisplay').textContent=ctt;
  document.getElementById('eosReasonDisplay').textContent=rt;
  document.getElementById('eosStartDisplay').textContent=sd||'—';
  document.getElementById('eosEndDisplay').textContent=ed||'—';
  document.getElementById('eosResult').style.display='block';

  if(!s||!sd||!ed||!ct||!r){document.getElementById('eosAmount').textContent='0.00 ريال';return}

  var st=new Date(sd),en=new Date(ed),td=Math.floor((en-st)/(1000*60*60*24));
  if(td<0)td=0;
  var ty=td/365,fp=Math.min(ty,5),sp=Math.max(ty-5,0),fa=(s*0.5*fp)+(s*sp),a=fa;

  if(r==='resign'){if(ty<2)a=0;else if(ty<=5)a=fa*(1/3);else if(ty<=10)a=fa*(2/3)}
  if(r==='probation_53'||r==='terminate_80'||r==='worker_terminate_81')a=0;

  document.getElementById('eosAmount').textContent=formatNumber(a)+' ريال';
}
</script>
