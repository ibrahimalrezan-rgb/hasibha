<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{TITLE}} - {{SITE_NAME}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="حاسبها">
<meta name="geo.region" content="SA">
<link rel="canonical" href="https://hasibha.com/{{SLUG}}">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="alternate" hreflang="ar" href="https://hasibha.com/{{SLUG}}">
<link rel="alternate" hreflang="en" href="https://hasibha.com/{{SLUG}}-en">
<link rel="alternate" hreflang="x-default" href="https://hasibha.com/{{SLUG}}">

<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="https://hasibha.com/{{SLUG}}">
<meta property="og:type" content="website">
<meta property="og:image" content="/images/logo.png">
<meta property="og:site_name" content="حاسبها">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="/images/logo.png">
<meta name="theme-color" content="#0b0d10">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-NZLXJFVCDW"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-NZLXJFVCDW');</script>

<script type="application/ld+json">
{{SCHEMA}}
</script>

<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-in">
    <a class="logo" href="/" aria-label="حاسبها">
      <img src="/images/logo.png" alt="حاسبها" style="height:36px;vertical-align:middle">
      حاسبها
    </a>
    <nav class="main-nav" aria-label="التنقل الرئيسي">
      <a href="/#calculators">{{NAV_CALC}}</a>
      <a href="/#features">{{NAV_FEATURES}}</a>
      <a href="/#faq">{{NAV_FAQ}}</a>
    </nav>
    <div class="header-actions">
      <button class="theme-btn" id="themeBtn" aria-label="Theme">
        <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="lang-btn" href="{{LANG_SWITCH_URL}}" hreflang="{{LANG_SWITCH_CODE}}" lang="{{LANG_SWITCH_CODE}}">{{LANG_SWITCH_TEXT}}</a>
    </div>
  </div>
</header>

<nav class="breadcrumb">
  <div class="wrap">
    <a href="/">{{BREADCRUMB_HOME}}</a>
    <span>←</span>
    <span style="color:var(--text);font-weight:600">{{TITLE}}</span>
  </div>
</nav>

<main>
<div class="wrap">
  <div class="calc-wrapper">
    <h1>{{H1}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>

{{FIELDS_HTML}}
    <button class="calc-btn" onclick="calculate()">{{CALC_BUTTON}}</button>

    <div class="result-card" id="resultCard">
{{RESULT_HTML}}
    </div>

    <a href="/" class="back-link">{{BACK_LINK}}</a>
  </div>

  <div class="article-box">
{{ARTICLE_HTML}}
  </div>
</div>
</main>

<footer class="site-footer">
  <div class="wrap footer-in">
    <a class="logo" href="/" style="font-size:16px">
      <img src="/images/logo.png" alt="حاسبها" style="height:28px;vertical-align:middle">
      حاسبها
    </a>
    <nav aria-label="Footer">
      <a href="/privacy">{{FOOTER_PRIVACY}}</a>
      <a href="/contact">{{FOOTER_CONTACT}}</a>
      <a href="/about">{{FOOTER_ABOUT}}</a>
    </nav>
    <p>{{FOOTER_COPYRIGHT}}</p>
  </div>
</footer>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');
  var moon=document.getElementById('iconMoon'), sun=document.getElementById('iconSun');
  function apply(t){
    if(t==='dark'){root.setAttribute('data-theme','dark');moon.style.display='none';sun.style.display='block';}
    else{root.removeAttribute('data-theme');moon.style.display='block';sun.style.display='none';}
  }
  var saved=null;
  try{saved=localStorage.getItem('hs-theme');}catch(e){}
  if(!saved){saved=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  apply(saved);
  btn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    apply(next);
    try{localStorage.setItem('hs-theme',next);}catch(e){}
  });
})();
document.getElementById('year').textContent=new Date().getFullYear();

{{CALC_SCRIPT}}
</script>
</body>
</html>
