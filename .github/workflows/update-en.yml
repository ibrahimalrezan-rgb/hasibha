name: Update English Pages

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug of the page to update (leave empty for all pages)'
        required: false
        default: ''

jobs:
  update-en:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Update English Pages
      run: |
        cd automation
        python update_en.py "${{ github.event.inputs.slug || '' }}"

    - name: Clean Python cache
      run: |
        rm -rf automation/__pycache__
        git rm -r --cached automation/__pycache__ --ignore-unmatch || true

    - name: Commit and Push
      run: |
        git config user.name "Hasibha Bot"
        git config user.email "bot@hasibha.com"
        git add -A
        if git diff --cached --quiet; then
          echo "ℹ️ لا توجد تغييرات للرفع"
        else
          git commit -m "🌐 تحديث تلقائي للصفحات الإنجليزية"
          git push
        fi
