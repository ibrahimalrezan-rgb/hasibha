name: Generate Calculators

on:
  push:
    paths:
      - 'automation/calculators.json'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation/generate.py
      
      - name: Commit changes
        run: |
          git config user.name "Hasibha Bot"
          git config user.email "bot@hasibha.com"
          git add .
          git diff --staged --quiet || git commit -m "🤖 إضافة حاسبات جديدة"
      
      - name: Push with retry loop
        run: |
          for i in 1 2 3 4 5; do
            echo "🔄 محاولة $i..."
            git fetch origin main
            git rebase origin/main || git rebase --abort
            
            if git push origin main; then
              echo "✅ نجح الرفع في المحاولة $i"
              exit 0
            fi
            
            echo "⚠️ فشلت المحاولة $i، ننتظر 10 ثواني..."
            sleep 10
          done
          
          echo "❌ فشلت كل المحاولات"
          exit 1
