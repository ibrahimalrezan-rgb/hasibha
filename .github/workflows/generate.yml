name: Generate Calculators

on:
  push:
    paths:
      - 'automation/calculators.json'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Configure Git
        run: |
          git config user.name "Hasibha Bot"
          git config user.email "bot@hasibha.com"
      
      - name: Generate with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation/generate.py
      
      - name: Commit and Push with Retry
        run: |
          git add .
          git diff --staged --quiet || git commit -m "🤖 إضافة حاسبات جديدة تلقائياً"
          
          # محاولة الرفع 3 مرات
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ نجح الرفع"
              exit 0
            fi
            echo "⚠️ محاولة $i فشلت، إعادة..."
            sleep 5
          done
          
          echo "❌ فشل الرفع بعد 3 محاولات"
          exit 1
