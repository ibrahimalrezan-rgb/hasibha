name: Generate Articles

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate new articles
      run: python automation/generate_article.py
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    - name: Update articles index + sitemap
      run: python automation/update_articles_index.py

    - name: Optimize speed (inline CSS + move scripts)
      run: python automation/optimize_speed.py

    - name: Create review pull request (never push directly to main)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "Hasibha Bot"
        git config user.email "bot@hasibha.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to propose."
          exit 0
        fi
        BRANCH="automation-review-${GITHUB_RUN_ID}"
        git checkout -b "$BRANCH"
        git commit -m "Proposed automated changes: ${GITHUB_WORKFLOW}"
        git push origin "$BRANCH"
        gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "Review automated changes: ${GITHUB_WORKFLOW}" --body "Generated by a manually triggered automation workflow. Review the diff before merging; this workflow does not publish changes directly."
