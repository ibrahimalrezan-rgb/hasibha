name: AI SEO Automation

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'المهمة المطلوبة'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - seo_only
          - content_only

jobs:
  ai-seo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run AI SEO Optimizer
      if: "github.event.inputs.task == 'all' || github.event.inputs.task == 'seo_only'"
      run: |
        cd automation
        python ai_seo_optimizer.py
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    - name: Check if content generator exists
      id: check_content
      run: |
        if [ -f "automation/ai_content_generator.py" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Run AI Content Generator
      if: "(github.event.inputs.task == 'all' || github.event.inputs.task == 'content_only') && steps.check_content.outputs.exists == 'true'"
      run: |
        cd automation
        python ai_content_generator.py
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    - name: Update English Pages
      run: |
        cd automation
        python update_en.py

    - name: Generate Index
      run: |
        cd automation
        python generate_index.py

    - name: Generate Sitemap
      run: |
        cd automation
        python generate_sitemap.py

    - name: Clean Python cache
      run: |
        rm -rf automation/__pycache__
        git rm -r --cached automation/__pycache__ --ignore-unmatch || true

    - name: Commit and Push
      run: |
        git config user.name "Hasibha Bot"
        git config user.email "bot@hasibha.com"
        git add -A
        if git diff --cached --quiet; then
          echo "ℹ️ لا توجد تغييرات للرفع"
        else
          git commit -m "🤖 تحديث تلقائي بالذكاء الاصطناعي"
          git push
        fi
