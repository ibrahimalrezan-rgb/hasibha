name: AI SEO Automation

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'المهمة المطلوبة'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - seo_only
          - content_only

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-seo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run AI SEO Optimizer
      if: "github.event.inputs.task == 'all' || github.event.inputs.task == 'seo_only'"
      run: |
        cd automation
        python ai_seo_optimizer.py
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    - name: Check if content generator exists
      id: check_content
      run: |
        if [ -f "automation/ai_content_generator.py" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Run AI Content Generator
      if: "(github.event.inputs.task == 'all' || github.event.inputs.task == 'content_only') && steps.check_content.outputs.exists == 'true'"
      run: |
        cd automation
        python ai_content_generator.py
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    - name: Clean Python cache
      run: |
        rm -rf automation/__pycache__
        git rm -r --cached automation/__pycache__ --ignore-unmatch || true

    - name: Create review pull request (never push directly to main)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "Hasibha Bot"
        git config user.email "bot@hasibha.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to propose."
          exit 0
        fi
        BRANCH="automation-review-${GITHUB_RUN_ID}"
        git checkout -b "$BRANCH"
        git commit -m "Proposed automated changes: ${GITHUB_WORKFLOW}"
        git push origin "$BRANCH"
        gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "Review automated changes: ${GITHUB_WORKFLOW}" --body "Generated by a manually triggered automation workflow. Review the diff before merging; this workflow does not publish changes directly."
